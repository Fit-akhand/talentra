
services:
  postgres:
    image: postgres:17
    container_name: talentra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: talentra
      POSTGRES_USER: talentra_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - talentra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentra_admin -d talentra"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  talentra_pgdata:
